.stage{position:relative;z-index:2;height:100%;display:flex;justify-content:center;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
.ph{position:relative;background:var(--scr);border:9px solid var(--frame);border-radius:42px;overflow:hidden;box-shadow:0 0 0 3px var(--frame2),0 14px 30px rgba(40,60,30,.28)}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--scr)}
.pat{background-image:radial-gradient(var(--line) 2px,transparent 2.5px);background-size:22px 22px}
#boot{z-index:9;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:24px;transition:opacity .5s,transform .5s}
#boot.off{opacity:0;transform:scale(1.06);pointer-events:none}
.lg{width:118px;height:118px;border-radius:50%;background:var(--nook);display:grid;place-items:center;margin-bottom:16px;box-shadow:0 6px 0 var(--line);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(-4deg)}}
#boot h1{font-size:clamp(22px,6.4vw,28px);line-height:1.15;margin:0;max-width:15ch}#boot p{color:var(--mut);margin:8px 0 34px}
.tap{animation:bl 1.4s infinite;font-weight:600;color:var(--verde)}@keyframes bl{50%{opacity:.25}}
.sb{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 2px;font-size:14px;font-weight:600}
.bat{display:inline-block;width:24px;height:11px;border:2px solid var(--tx);border-radius:4px;position:relative;vertical-align:middle;margin-left:6px}.bat:after{content:"";position:absolute;inset:1px 5px 1px 1px;background:var(--verde);border-radius:1px}
.who{display:flex;align-items:center;gap:10px;padding:8px 20px 2px}
.ico{flex:none;width:46px;height:46px;border-radius:50%;background:#FBD3DC;overflow:hidden;border:3px solid var(--card);box-shadow:0 2px 0 var(--line);cursor:pointer;padding:0}
.ico svg{width:100%;height:100%;display:block}
.who b{display:block;line-height:1.15;font-size:15px}.who span{font-size:12.5px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:16px 12px 10px;overflow:auto}
@media (max-width:350px){.grid{grid-template-columns:repeat(3,1fr)}}
.ap{background:none;border:0;color:var(--tx);font:inherit;font-size:12px;font-weight:600;line-height:1.2;text-align:center;cursor:pointer;min-height:44px;padding:0}
.ap i{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 5px;border-radius:19px;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .15s;overflow:hidden}
.ap:hover i{transform:translateY(-2px)}.ap:active i{transform:scale(.92)}.ap i>svg{width:40px;height:40px;fill:#fff}.ap i>svg.face{width:60px;height:60px}
.dock{margin:auto 16px 14px;padding:9px 12px;border-radius:22px;background:var(--card);text-align:center;font-size:12.5px;color:var(--mut);box-shadow:0 3px 0 var(--line)}
#app{z-index:5;transform:translateY(102%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}#app.on{transform:none}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--c);color:#fff;font-weight:600;font-size:18px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.hd button{background:rgba(255,255,255,.28);color:#fff;border:0;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:36px}
.bd{overflow:auto;padding:16px 16px 30px;flex:1;overscroll-behavior:contain}
.bd h3{margin:0 0 6px;font-size:19px;line-height:1.25}.bd h4{margin:0 0 4px;font-size:16px}.bd p{margin:7px 0}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 3px 0 var(--line);margin:12px 0}
.mut{color:var(--mut);font-size:14px}.inf{min-height:46px;font-weight:600}
.lead{font-size:16.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stats div{background:var(--card);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 3px 0 var(--line)}.stats b{display:block;font-size:21px;color:var(--nook);line-height:1.1}.stats span{font-size:12px;color:var(--mut)}
details{background:var(--card);border-radius:18px;box-shadow:0 3px 0 var(--line);margin:10px 0;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 40px 12px 14px;font-weight:600;position:relative;min-height:44px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:14px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--c,var(--nook));color:#fff;display:grid;place-items:center;font-size:17px;line-height:1}
details[open] summary:after{content:"–"}
details>div{padding:0 14px 12px}
.tip{background:#FFF1C9;color:#4A3728;border-radius:16px;padding:10px 12px 10px 44px;position:relative;margin:12px 0;font-size:15px}
.tip:before{content:"💡";position:absolute;left:12px;top:9px;font-size:20px}
.ref{font-size:12.5px;color:var(--mut)}
.bar{display:flex;height:34px;border-radius:12px;overflow:hidden;background:var(--areia);margin:4px 0 12px}
.bar span{display:grid;place-items:center;font-size:13px;font-weight:600;width:0;transition:width 1s;color:#fff;cursor:pointer;white-space:nowrap}
.tog{display:flex;gap:8px;margin:6px 0}.tog button{flex:1;border:2px solid var(--verde);background:none;color:var(--tx);border-radius:99px;padding:6px;font:600 13px inherit;font-family:inherit;min-height:44px;cursor:pointer}.tog button.on{background:var(--verde);color:#fff}
.cols{display:flex;height:220px;gap:6px;position:relative;border-bottom:3px solid var(--mad);margin-top:16px}.cols .mid{position:absolute;left:0;right:0;bottom:50%;border-top:2px dashed var(--line)}
.col{flex:1;position:relative}.dot{position:absolute;left:50%;width:46px;height:46px;margin:0 0 -23px -23px;border-radius:50%;background:var(--verde);border:4px solid var(--card);display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;transition:bottom .8s;bottom:0;cursor:pointer}
.labs{display:flex;gap:6px;text-align:center;font-size:12px;margin-top:6px}.labs div{flex:1}
.coef{position:relative;height:42px;margin:8px 0}.coef i{position:absolute;top:19px;height:4px;border-radius:2px;background:var(--mad)}.coef b{position:absolute;top:8px;width:26px;height:26px;margin-left:-13px;border-radius:50%;border:3px solid var(--card);cursor:pointer}.zero{position:absolute;top:0;bottom:0;border-left:2px dashed var(--mut)}
.wf{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:8px 0}.wf span{aspect-ratio:1;border-radius:30%;background:var(--areia)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.gl div{border-left:5px solid var(--ouro);padding:4px 10px;margin:8px 0;background:var(--card);border-radius:0 12px 12px 0;font-size:15px}
.seal{display:inline-block;background:var(--ouro);color:#4A3728;border-radius:99px;padding:3px 12px;font-weight:600;font-size:13px}
.dlg{position:relative;background:var(--card);border:3px solid var(--mad);border-radius:20px;padding:20px 14px 12px;margin:22px 0 10px}.dlg .tag{position:absolute;top:-15px;left:14px;background:var(--rosa);color:#fff;border-radius:99px;padding:1px 14px;font-weight:600;border:3px solid var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:99px;background:var(--verde);color:#fff;font:600 14px inherit;font-family:inherit;padding:8px 16px;min-height:44px;cursor:pointer;margin:4px 4px 0 0}
.btn.alt{background:var(--areia);color:#4A3728}
.crit .r{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.crit .t{height:26px;background:var(--areia);border-radius:9px;overflow:hidden}.crit .t span{display:block;height:100%;width:0;min-width:36px;border-radius:9px;transition:width .9s;color:#fff;font-size:12.5px;font-weight:600;padding-left:8px;line-height:26px;white-space:nowrap}
.season{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}.season .s{font-size:44px;text-align:center;line-height:1}
.qz button.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:9px 12px;margin:6px 0;font:500 15px inherit;font-family:inherit;cursor:pointer;min-height:44px}
.qz button.ok{border-color:var(--verde);background:#e3f4df;color:#2c5a28}.qz button.no{border-color:#e0735c;background:#fbe3dd;color:#7a2e1f}
.hm{width:90px;height:4px;border-radius:2px;background:var(--mad);opacity:.35;margin:2px auto 8px}
.phw{position:relative;width:min(410px,100%);height:min(820px,calc(100dvh - 170px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}
.phw .ph{width:100%;height:100%}

/* Poly: anda, acena e pisca */
.ch{position:fixed;left:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:3;transform:translateX(-200px);cursor:inherit;-webkit-tap-highlight-color:transparent;opacity:0;transition:opacity .4s;outline:none}
.ch.in{opacity:1}
.ch{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ch img,.ch svg{pointer-events:none;-webkit-user-drag:none;user-select:none}
.ch .pl{pointer-events:auto}
.ch.held{z-index:7;cursor:grabbing}
.ch.held .fx{animation:dangle .9s ease-in-out infinite;transform-origin:50% 8%}
@keyframes dangle{0%,100%{transform:rotate(-7deg) scale(1.06)}50%{transform:rotate(7deg) scale(1.06)}}
.ch.held .legL{animation:kick .45s ease-in-out infinite}.ch.held .legR{animation:kick .45s ease-in-out .22s infinite}
@keyframes kick{50%{transform:rotate(14deg)}}
.ch.held .armL{transform:rotate(60deg)}.ch.held .armR{transform:rotate(-60deg)}
.ch.held .shd{opacity:0}
.ch.drop .fx{animation:land .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(1.12,.86)}60%{transform:scale(.96,1.05)}100%{transform:none}}
.ch .shd{position:absolute;left:50%;bottom:-3px;width:66%;height:10px;margin-left:-33%;border-radius:50%;background:rgba(40,60,20,.28);filter:blur(1.5px)}
.ch .fx{position:relative;transform-origin:50% 100%}
.ch .flip{transform-origin:50% 100%;transition:transform .22s cubic-bezier(.4,1.4,.6,1)}
.ch.walk .fx{animation:hop .5s ease-in-out infinite}
@keyframes hop{0%,50%,100%{transform:translateY(0) scale(1.02,.98)}25%,75%{transform:translateY(-4px) scale(.99,1.02)}}
.ch.walk .shd{animation:shd .5s ease-in-out infinite}@keyframes shd{25%,75%{transform:scaleX(.84)}}
.ch.idle .fx{animation:br 2.8s ease-in-out infinite}@keyframes br{50%{transform:scale(1.01,.988)}}
.ch.wave .fx{animation:jump .9s cubic-bezier(.3,1.5,.6,1)}
@keyframes jump{0%{transform:scale(1.04,.95)}18%{transform:translateY(-12px) scale(.97,1.04)}36%{transform:translateY(0) scale(1.03,.97)}50%,100%{transform:none}}
.dust{position:absolute;bottom:0;width:12px;height:12px;border-radius:50%;background:rgba(255,250,235,.85);opacity:0;pointer-events:none}
.dust.a{left:20%}.dust.b{right:20%}
.ch.walk .dust.a{animation:dust .5s ease-out infinite}.ch.walk .dust.b{animation:dust .5s ease-out .25s infinite}
@keyframes dust{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:translate(-10px,-8px) scale(1.4)}}
.emo{position:absolute;left:50%;top:-20px;width:60px;height:30px;margin-left:-30px;pointer-events:none;opacity:0}
.ch.wave .emo{animation:emo 1.6s ease-out}
@keyframes emo{0%{opacity:0;transform:scale(.3) translateY(10px)}20%{opacity:1;transform:scale(1.1)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.pl{position:relative;width:70px;height:128.5px}
.pl img,.pl svg{position:absolute;left:0;top:0;width:70px;height:128.5px;display:block;overflow:visible}
.pl .armL{transform-origin:19.9px 67.6px}.pl .armR{transform-origin:50.1px 67.6px}
.pl .legL{transform-origin:27.4px 97.6px}.pl .legR{transform-origin:42.8px 97.6px}
.ch.walk .legL{animation:lgA .5s ease-in-out infinite}.ch.walk .legR{animation:lgB .5s ease-in-out infinite}
@keyframes lgA{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translateY(-1.5px)}}
@keyframes lgB{0%,100%{transform:rotate(9deg) translateY(-1.5px)}50%{transform:rotate(-9deg)}}
.ch.walk .armL{animation:amA .5s ease-in-out infinite}.ch.walk .armR{animation:amB .5s ease-in-out infinite}
@keyframes amA{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-10deg)}}
@keyframes amB{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
.ch.wave .armR{animation:greet 1.6s ease-in-out}
@keyframes greet{0%,100%{transform:rotate(0)}12%{transform:rotate(-108deg)}24%{transform:rotate(-84deg)}36%{transform:rotate(-108deg)}48%{transform:rotate(-84deg)}60%{transform:rotate(-108deg)}72%{transform:rotate(-84deg)}86%{transform:rotate(-100deg)}}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
.ch .lids{animation:none}
.ch .lid{animation:pblink 5.5s infinite}
.ch.blink .lid{animation:pclick .45s ease-in-out}
@keyframes pblink{0%,92%,100%{transform:scaleY(0)}94.5%,96%{transform:scaleY(1)}}
@keyframes pclick{0%,100%{transform:scaleY(0)}35%,60%{transform:scaleY(1)}}
.bub{position:fixed;z-index:6;max-width:min(240px,calc(100vw - 20px));background:#fffaf0;color:#4A3728;border:3px solid #8B5E3C;border-radius:18px;padding:8px 12px;font-size:14px;font-weight:500;line-height:1.35;box-shadow:0 4px 0 rgba(0,0,0,.12);pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s,transform .25s}
.bub.on{opacity:1;transform:none}
.bub b{display:block;font-size:12px;color:#c25f7c}
.bub:after{content:"";position:absolute;bottom:-10px;left:var(--ax,50%);width:14px;height:14px;background:#fffaf0;border-right:3px solid #8B5E3C;border-bottom:3px solid #8B5E3C;transform:translateX(-50%) rotate(45deg)}
.ico img,.ap i>img{width:100%;height:100%;object-fit:cover;display:block}

<h3>O que é Animal Crossing?</h3>
<p class="lead">É uma série de videogames da Nintendo em que você vive numa vila (ou ilha) habitada por animais falantes. Não há vilões, não há como “perder” e o relógio do jogo é o mesmo do mundo real: se é noite para você, é noite na ilha.</p>
<div class="stats"><div><b>2001</b><span>1º jogo da série</span></div><div><b>20/03/20</b><span>lançamento de New Horizons</span></div><div><b>50,29 mi</b><span>cópias vendidas</span></div></div>
<details open><summary>Uma ilha deserta para construir</summary><div><p>Em <i>New Horizons</i>, o jogador compra um pacote de “férias” e chega a uma ilha quase vazia. Aos poucos, ele coleta recursos (madeira, frutas, pedras, conchas), cria ferramentas, recebe novos moradores e decide onde ficam casas, pontes, rios e jardins. Mais tarde, ganha até o poder de remodelar o terreno, cavando rios e erguendo penhascos.</p><p>Essa liberdade é o que torna o jogo interessante para pensar a natureza: <b>a ilha é um ecossistema que o jogador pode cuidar, explorar ou transformar</b>.</p></div></details>
<details><summary>Por que ele virou um fenômeno em 2020</summary><div><p>O jogo saiu em 20 de março de 2020, nas primeiras semanas de quarentena da COVID-19. Sem poder sair de casa, milhões de pessoas usaram a ilha para encontrar amigos, comemorar aniversários e até fazer formaturas e casamentos virtuais.</p><p>Segundo o relatório da Nintendo de agosto de 2026, <i>New Horizons</i> já soma 50,29 milhões de cópias vendidas, um dos maiores sucessos da história do console.</p></div></details>
<details><summary>Quem é quem na ilha</summary><div><div class="gl"><div><b>Tom Nook</b> é o guaxinim empreendedor que organiza a ilha (e cobra seus empréstimos).</div><div><b>Moradores (villagers)</b> são vizinhos animais com personalidade própria: conversam, trocam presentes e se mudam.</div><div><b>Bells</b> são a moeda do jogo. <b>Nook Miles</b> são pontos ganhos por cumprir tarefas, muitas delas ligadas à natureza.</div><div><b>Você</b> é o morador humano que decide o destino da ilha.</div></div></div></details>
<div class="tip">O tempo real é um elemento de design pensado para criar rotina: o jogo convida a voltar um pouco todo dia, e não a jogar horas seguidas.</div>
<p class="ref">Fontes: relatório financeiro da Nintendo (agosto de 2026), via Shacknews.</p>
</template>

<template id="t-natureza">
<h3>A natureza dentro do jogo</h3>
<p class="lead">Animal Crossing simula, de forma simplificada, várias coisas que existem num ecossistema real: estações, ciclo de dia e noite, espécies que aparecem só em certas épocas e plantas que crescem com cuidado.</p>
<div class="card"><h4>Que estação é hoje na ilha?</h4><p class="mut">No início do jogo, você escolhe o hemisfério da ilha. Isso muda as estações e os animais de cada mês, como no mundo real.</p><div class="tog"><button id="hN" class="on">Hemisfério Norte</button><button id="hS">Hemisfério Sul</button></div><div class="season"><div class="s" id="sEmo">🍂</div><div><b id="sNom"></b><p class="mut" id="sTxt"></p></div></div></div>
<details open><summary>Biodiversidade: 200 espécies para encontrar</summary><div><p>A ilha tem 80 espécies de insetos, 80 de peixes e 40 criaturas marinhas, que só podem ser pegas mergulhando. Cada espécie aparece em certos meses e horários, e muitas só saem à noite. Isso ensina, brincando, algo que a ecologia chama de <b>sazonalidade</b>: a natureza muda ao longo do ano.</p></div></details>
<details><summary>Flores: genética e polinização</summary><div><p>Ao plantar flores lado a lado e regá-las, o jogador pode obter <b>híbridos</b> de cores raras. A lógica lembra a herança genética das ervilhas de Mendel: cores dependem da combinação de “genes” das flores-mãe. Visitas de amigos que regam a ilha aumentam as chances, uma pequena metáfora da polinização e da cooperação.</p></div></details>
<details><summary>Árvores, ervas daninhas e lixo</summary><div><p>Árvores podem ser cortadas para virar madeira e replantadas como mudas. Ervas daninhas crescem se a ilha fica sem cuidado, e o mar às vezes devolve lixo (botas, latas, pneus) ao pescar. A avaliação da ilha leva em conta árvores, flores e a ausência de ervas daninhas e lixo: o jogo <b>recompensa uma ilha bem cuidada</b>.</p></div></details>
<details><summary>Dia da Natureza (Nature Day)</summary><div><p>Em 2020, de 23 de abril a 4 de maio, o jogo realizou o Dia da Natureza, ligado ao Dia da Terra. O personagem Leif montou uma loja de arbustos e sementes, e tarefas especiais davam Nook Miles a quem plantasse e cuidasse da ilha. Foi um dos momentos em que o jogo trouxe uma mensagem ambiental explícita.</p></div></details>
<div class="tip">O jogo também tem o lado oposto: dá para cortar todas as árvores, remodelar rios e penhascos e vender insetos e peixes. Essa tensão entre <b>cuidar</b> e <b>explorar</b> é justamente o que esta pesquisa investiga.</div>
<p class="ref">Fontes: Keengamer (lista de espécies), Nookipedia (criaturas marinhas, atualização 1.3.0), iMore (Dia da Natureza 2020).</p>
</template>

<template id="t-museu">
<h3>O museu e a Critterpedia</h3>
<p class="lead">Toda espécie pega pode ser doada ao museu da ilha, cuidado por Blathers, uma coruja curadora. Ao doar, ele conta curiosidades reais sobre o animal: hábitos, alimentação, onde vive.</p>
<div class="card crit"><h4>Quantas espécies existem?</h4><div class="tog"><button id="cT" class="on">Todas</button><button id="cN">Só à noite</button></div><div id="crit"></div><p class="mut" id="critTxt"></p></div>
<details open><summary>Um museu de história natural de bolso</summary><div><p>O museu reúne insetos, peixes, criaturas marinhas, fósseis e obras de arte. Os aquários e viveiros imitam habitats (rio, lago, mar, floresta), e as placas dão o nome de cada espécie. Para muitos jogadores, foi o primeiro contato com animais como o celacanto, um peixe que se pensava extinto até 1938.</p></div></details>
<details><summary>Colecionar ou conservar?</summary><div><p>O museu valoriza a <b>observação e o conhecimento</b>: cada espécie é exibida viva e identificada. Mas as mesmas espécies também podem ser vendidas por Bells, e algumas valem muito. A comunidade criou até “ilhas de tarântulas” para capturar em massa e lucrar. É um exemplo concreto da mesma tensão entre valor natural e valor econômico.</p></div></details>
<details><summary>Arte e cultura</summary><div><p>A ala de arte reúne réplicas de obras famosas, como pinturas e esculturas clássicas. O comerciante Redd vende algumas falsificadas, e o jogador precisa aprender a comparar detalhes para identificar a original: uma forma lúdica de apresentar história da arte.</p></div></details>
<p class="ref">Fonte das contagens: Keengamer (guia de espécies noturnas).</p>
</template>

<template id="t-sociedade">
<h3>A ilha também é social</h3>
<p class="lead">Animal Crossing não é só sobre natureza: é sobre convivência. Presentear, visitar e cuidar juntos são ações centrais, e isso conecta o jogo com a vida em sociedade.</p>
<details open><summary>Presentes, vizinhos e comunidade</summary><div><p>Os moradores ficam mais próximos de quem conversa com eles e dá presentes, e uma flor é um dos presentes mais simples. Por isso, nesta pesquisa, <b>presentear flores</b> representa o valor social da natureza, e <b>vender flores</b> representa o valor econômico.</p></div></details>
<details><summary>Jogar faz bem? O estudo de Oxford</summary><div><p>Pesquisadores da Universidade de Oxford cruzaram questionários com o tempo real de jogo, registrado pelos próprios consoles, de 2.756 jogadores de <i>New Horizons</i>. Encontraram uma associação pequena e positiva entre tempo de jogo e bem-estar, e concluíram que a <b>qualidade da experiência</b> (prazer, sensação de competência, conexão social) importa mais que o número de horas.</p><p class="mut">Também é uma associação, não prova de causa.</p></div></details>
<details><summary>Economia: Bells, empréstimos e o mercado de nabos</summary><div><p>A ilha tem uma economia própria: o jogador paga empréstimos ao Tom Nook, vende recursos na loja e pode especular com nabos, cujo preço muda durante a semana como numa bolsa de valores. A natureza, nesse sistema, também vira mercadoria.</p></div></details>
<div class="tip">Durante a quarentena de 2020, ilhas viraram palco de festas, protestos, campanhas políticas e reencontros entre amigos distantes.</div>
<p class="ref">Fonte: Oxford Internet Institute; Johannes, Vuorre e Przybylski (2021), <i>Royal Society Open Science</i>.</p>
</template>

<template id="t-pesq">
<h3>Por que esta pesquisa?</h3>
<p class="lead">Na ilha, dá para cuidar da natureza ou explorá-la. Então vem a pergunta: <b>o que a gente pensa sobre a natureza combina com o que a gente faz com ela no jogo?</b></p>
<div class="stats"><div><b>640</b><span>jogadores</span></div><div><b>29</b><span>países</span></div><div><b>15–30/05</b><span>de 2020</span></div></div>
<div class="card"><div class="gl"><div><b>1.</b> Quem joga mais pensa diferente sobre a natureza?</div><div><b>2.</b> Isso aparece no que se faz com as flores?</div></div></div>
<details open><summary>De onde vêm os dados</summary><div><p>Uma equipe liderada por Quan-Hoang Vuong aplicou um questionário on-line a jogadores de <i>New Horizons</i> em maio de 2020 e publicou as respostas como base de dados aberta na revista <i>Data Intelligence</i> (2021). O questionário tem seis blocos: perfil, preocupação com a COVID-19, percepção ambiental, hábitos de jogo, comportamentos no jogo e sentimentos ao jogar.</p></div></details>
<details><summary>O que outros estudos já viram com esta base</summary><div><p>Um estudo com 584 respostas, em <i>Technology in Society</i> (2021), encontrou uma tendência a <b>explorar o ambiente do jogo independentemente das percepções</b> dos jogadores, e sugeriu que o design simplificado dos jogos comerciais perde chances de estimular ações pró-ambientais. Outro estudo, em <i>Entertainment Computing</i>, indicou que a percepção pode influenciar o comportamento, mas nem sempre.</p></div></details>
<details><summary>Como a análise foi feita</summary><div><p>Limpei a base, escolhi as variáveis, analisei cada uma isoladamente e depois em pares (correlação de Spearman, testes de diferença) e, por fim, usei regressões para comparar pessoas parecidas em idade, sexo, região e frequência de jogo.</p></div></details>
</template>

<template id="t-pens">
<h3>O que pensam da natureza</h3>
<p>Quase todos concordam que a humanidade está abusando do meio ambiente. Toque nas barras.</p>
<div class="card" id="pensBars"><p class="inf" id="inf">&nbsp;</p><p class="mut">Marrom = discorda · areia = neutro · verde = concorda (mais pró-ambiental).</p></div>
<details open><summary>Duas formas de ver a natureza</summary><div><p>A psicologia ambiental costuma separar dois polos. Na visão <b>antropocêntrica</b>, a natureza existe para servir aos humanos. Na visão <b>ecocêntrica</b>, ela tem valor próprio, e os humanos são parte dela. As perguntas desta pesquisa vêm de uma escala inspirada no Novo Paradigma Ecológico (NEP), muito usada para medir essas atitudes.</p></div></details>
<details><summary>Por que C12 é a pergunta-chave</summary><div><p>Quase todo mundo concorda que há abuso ambiental (C5), então essa pergunta varia pouco. Já a ideia de que “os humanos nasceram para dominar a natureza” (C12) divide mais as opiniões: 25,5% concordam com ela. Por isso C12 é melhor para comparar grupos.</p></div></details>
</template>

<template id="t-jogar">
<h3>Quem joga mais pensa diferente?</h3>
<p>Quem joga <b>todos os dias</b> rejeita mais a ideia de dominar a natureza: média de 3,9 contra 2,7 de quem joga semanalmente ou menos.</p>
<div class="card" id="freqBox"><p class="mut">Média de 1 a 5 (5 = mais pró-ambiental). Linha tracejada = neutro.</p><p class="inf" id="inf">&nbsp;</p></div>
<div class="card"><b>Mesmo comparando pessoas parecidas</b> em idade, sexo e região, cada degrau a mais na frequência soma cerca de 0,20 ponto em C12 (IC 95%: 0,10 a 0,30) e 0,19 em C5 (IC 95%: 0,11 a 0,27).</div>
<span class="seal">Associação, não causa</span> <span class="mut">Quem já se importa com a natureza também pode jogar mais.</span>
<details><summary>Duas explicações possíveis</summary><div><div class="gl"><div><b>O jogo influencia:</b> conviver todo dia com estações, espécies e jardins poderia aproximar o jogador da natureza.</div><div><b>Seleção:</b> pessoas que já gostam de natureza podem se interessar mais por um jogo sobre uma ilha, e jogar mais.</div></div><p>Os dados, coletados uma única vez, não conseguem separar as duas. Seria preciso acompanhar as mesmas pessoas ao longo do tempo.</p></div></details>
<details><summary>Cuidados com o resultado</summary><div><p>84% da amostra joga todos ou quase todos os dias, e o grupo “semanal ou menos” tem só 104 pessoas. A amostra foi recrutada em comunidades on-line, então os jogadores mais engajados podem estar sobrerrepresentados.</p></div></details>
</template>

<template id="t-flor">
<h3>E as flores da ilha?</h3>
<div class="card" style="text-align:center"><b>Teste você: a Poly colheu uma flor. E agora?</b><div class="tog"><button id="gp">Presentear um vizinho</button><button id="gv">Vender na loja do Nook</button></div><p class="inf" id="gm" aria-live="polite">Escolha uma opção.</p><p class="mut" id="gc">Presentes: 0 · Vendas: 0</p></div>
<p>Presentear e vender são igualmente frequentes (mediana 2 nas duas) e andam juntos (ρ = 0,27). Mas quem mais rejeita dominar a natureza mexe um pouco <em>menos</em> com flores, o contrário do que muita gente esperaria.</p>
<div class="card" id="coefBox"><b>Efeito de +1 ponto em C12 (IC 95%)</b><p class="inf" id="inf">&nbsp;</p><p class="mut">Frequência de 1 a 4. À esquerda da linha tracejada = quem pensa mais pró-ambiental faz menos. Controlado por idade, frequência de jogo e sexo.</p></div>
<details><summary>Por que isso pode acontecer? (hipóteses)</summary><div><p>Os dados não dizem o porquê, mas há hipóteses para estudos futuros: quem valoriza a natureza pode preferir <b>deixar as flores plantadas</b> em vez de colhê-las; ou pode jogar de outras formas (decorar, explorar, conversar). Também pode ser que o jogo, ao recompensar mais o lucro do que o cuidado, aproxime todos os jogadores do mesmo comportamento.</p></div></details>
<div class="tip">Isso conversa com os estudos anteriores: o que o jogador pensa da natureza nem sempre aparece no que ele faz no jogo.</div>
</template>

<template id="t-sexo">
<h3>Um detalhe: sexo biológico</h3>
<p>Mulheres rejeitam mais a dominação da natureza do que homens, e os homens vendem mais flores, mesmo comparando mesma idade e frequência de jogo.</p>
<div class="card" id="sexBox"><p class="mut">Escala de 1 a 5. δ de Cliff = 0,47 (efeito médio). Vender: razão de chance 1,59 para os homens (p = 0,007).</p></div>
<details><summary>Como ler esse resultado</summary><div><p>Diferenças de gênero em atitudes ambientais aparecem em muitas pesquisas, e costumam ser atribuídas à socialização, e não à biologia. Aqui, a diferença é a maior de toda a análise, o que mostra que, ao comparar jogadores, é importante levar em conta quem eles são.</p></div></details>
</template>

<template id="t-oito">
<h3>Quanto isso explica?</h3>
<p>A atitude explica só cerca de 8% do que as pessoas fazem com as flores. Os outros 92% são estilo de jogo, gosto, amizades…</p>
<div class="card two"><div><b>Presentear</b><div id="w1"></div><span class="mut">8,1% explicado</span></div><div><b>Vender</b><div id="w2"></div><span class="mut">7,6% explicado</span></div></div>
<details><summary>O que é esse “R²”</summary><div><p>O R² mede quanto da variação de um comportamento o modelo consegue prever. Um R² de 8% quer dizer que, mesmo sabendo a atitude, idade, sexo e frequência de jogo de alguém, ainda é difícil prever com que frequência essa pessoa presenteia ou vende flores.</p></div></details>
</template>

<template id="t-dic">
<h3>Mini-dicionário</h3>
<div class="gl"><div><b>C12</b>: “os humanos nasceram para dominar a natureza”. Rejeitar = mais pró-ambiental.</div><div><b>C5</b>: “os humanos estão abusando do meio ambiente”. Concordar = mais pró-ambiental.</div><div><b>Média</b>: o valor típico do grupo, de 1 a 5.</div><div><b>Mediana</b>: o valor do meio, quando todas as respostas são ordenadas.</div><div><b>Correlação (ρ)</b>: mede se duas coisas sobem ou descem juntas, de −1 a 1.</div><div><b>IC 95%</b>: faixa em que o valor verdadeiro provavelmente está. Se não toca o zero, o efeito é consistente.</div><div><b>R²</b>: quanto do comportamento o modelo consegue explicar.</div><div><b>Associação ≠ causa</b>: duas coisas andarem juntas não prova que uma causa a outra.</div><div><b>Sazonalidade</b>: mudança da natureza ao longo do ano.</div><div><b>Antropocentrismo</b>: visão de que a natureza existe para servir aos humanos.</div></div>
</template>

<template id="t-fim">
<div class="dlg"><span class="tag">Poly</span><b>Quem joga mais tende a pensar de forma mais pró-ambiental, mas o que a gente pensa e o que a gente faz na ilha nem sempre andam juntos.</b></div>
<div class="card"><h3>Dá para dizer</h3><p>Entre esses 640 jogadores, quem joga mais pensa de forma mais pró-ambiental, e a atitude explica pouco do que se faz com as flores.</p></div>
<div class="card"><h3>Não dá para dizer</h3><p>Que o jogo muda a cabeça das pessoas, nem que vale para todos os jogadores do mundo: a amostra é de conveniência.</p></div>
<details><summary>E se os jogos fossem desenhados para a natureza?</summary><div><p>Se o jogo recompensa mais o lucro do que o cuidado, é natural que o comportamento siga as recompensas. Eventos como o Dia da Natureza mostram que dá para premiar plantar, observar e preservar. Jogos com milhões de jogadores são uma oportunidade real de educação ambiental.</p></div></details>
</template>
